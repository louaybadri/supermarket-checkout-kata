<section class="cart card">
  <h2>
    Your cart
    <span class="count">{{ cart.itemCount() }}</span>
  </h2>

  @if (cart.isEmpty()) {
    <p class="empty">Nothing in it yet.</p>
  } @else {
    @for (line of cart.lines(); track line.product.sku) {
      <article class="line">
        <span class="name">{{ line.product.name }}</span>
        <span class="price">{{ line.product.unitPriceCents / 100 | currency: 'EUR' }}</span>

        <span class="stepper">
          <button
            type="button"
            class="button-quiet"
            (click)="cart.removeOne(line.product.sku)"
            [attr.aria-label]="'One less ' + line.product.name"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>

          <input
            class="quantity"
            type="number"
            inputmode="numeric"
            min="1"
            [max]="line.product.maxQuantity"
            [value]="line.quantity"
            (change)="setQuantity(line, $event)"
            [attr.aria-label]="'How many ' + line.product.name"
          />

          <button
            type="button"
            class="button-quiet"
            (click)="cart.add(line.product)"
            [disabled]="!cart.canAddMoreOf(line.product)"
            [attr.aria-label]="'One more ' + line.product.name"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </span>

        <button
          type="button"
          class="button-quiet remove"
          (click)="cart.removeLine(line.product.sku)"
          [attr.aria-label]="'Remove ' + line.product.name"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
          </svg>
        </button>
      </article>
    }

    <button type="button" class="button-quiet clear" (click)="cart.clear()">Empty the cart</button>
  }
</section>
